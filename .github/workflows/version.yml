name: Version policy

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for a merged main PR (including retry)"
        required: true
        type: choice
        options: [patch, minor, major]
      commit:
        description: "Optional full merged commit SHA for recovery; empty uses the selected main commit"
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-label:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/release/version_policy.py label --json "$GITHUB_EVENT_PATH"

  resolve:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bump: ${{ steps.pr.outputs.bump }}
      commit: ${{ steps.pr.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve merged PR version bump
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_BUMP: ${{ inputs.bump }}
          TARGET_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            bump="$MANUAL_BUMP"
          else
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" > "$RUNNER_TEMP/associated-prs.json"
            bump="$(python scripts/release/version_policy.py resolve --json "$RUNNER_TEMP/associated-prs.json" --commit "$GITHUB_SHA")"
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"

  tag:
    needs: resolve
    if: needs.resolve.outputs.bump != ''
    runs-on: ubuntu-24.04
    concurrency:
      group: toffee-version-tag
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.commit }}
      - name: Verify merge result and create or reuse its tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ needs.resolve.outputs.bump }}
        run: |
          git fetch origin main:refs/remotes/origin/main --tags
          python scripts/release/version_policy.py verify
          tag="$(python scripts/release/version_policy.py next --bump "$BUMP")"
          if ! git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" -m "Toffee ${tag#v}"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Dispatch tagged verification and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          python -c 'import json, os; print(json.dumps({"event_type": "version-tagged", "client_payload": {"tag": os.environ["TAG"], "sha": os.environ["TARGET_COMMIT"]}}))' |
            gh api -X POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
