[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8,<10"]
build-backend = "setuptools.build_meta"

[project]
name = "xreactor"
dynamic = ["version"]
description = "Asyncio-native simulation triggers backed by xcomm"
readme = "README.md"
requires-python = ">=3.11"
license = "MulanPSL-2.0"
license-files = ["LICENSE"]
authors = [{name = "XS-MLVP"}]
dependencies = []

[project.optional-dependencies]
runner = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6,<4",
]
native = [
    "xspcomm>=0.3.0.dev3,<0.4",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6,<4",
    "pytest-cov>=5",
]
docs = [
    "mkdocs>=1.6",
]

[project.scripts]
xreactor = "xreactor.cli:main"
xreactor-coverage-report = "xreactor.coverage_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xreactor = ["templates/*.html", "templates/*.css", "py.typed"]

[tool.setuptools_scm]
fallback_version = "0.1.0.dev0"
tag_regex = '^v(?P<version>\d+\.\d+\.\d+)$'
git_describe_command = 'git describe --dirty --tags --long --match "v[0-9]*"'

[tool.pyright]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "examples/getting_started", "examples/transactions/test_pipeline_coverage.py"]
